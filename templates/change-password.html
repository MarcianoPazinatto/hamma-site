<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trocar Senha - Hama Sharing App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .navbar {
            background-color: rgba(0, 0, 0, 0.1) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
            color: white !important;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.8) !important;
            transition: color 0.3s ease;
        }

        .nav-link:hover {
            color: white !important;
        }

        .container-main {
            padding: 40px 0;
        }

        .change-password-container {
            max-width: 500px;
            margin: 0 auto;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }

        .card-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .card-subtitle {
            font-size: 0.9rem;
            color: #666;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .form-control {
            border-radius: 10px;
            border: 1px solid #dee2e6;
            padding: 12px 15px;
            font-size: 1rem;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }

        .btn-change {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            color: white;
            width: 100%;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .btn-change:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            color: white;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid white;
            color: white;
            border-radius: 10px;
            padding: 10px 20px;
            font-weight: 600;
            width: 100%;
            margin-top: 15px;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.3);
            color: white;
        }

        .alert {
            border-radius: 10px;
            border: none;
            margin-bottom: 20px;
        }

        .password-strength {
            height: 5px;
            border-radius: 5px;
            margin-top: 8px;
            display: none;
        }

        .password-strength.show {
            display: block;
        }

        .password-strength.weak {
            background-color: #dc3545;
        }

        .password-strength.medium {
            background-color: #ffc107;
        }

        .password-strength.strong {
            background-color: #28a745;
        }

        .strength-text {
            font-size: 0.8rem;
            margin-top: 5px;
            display: none;
        }

        .strength-text.show {
            display: block;
        }

        .strength-text.weak {
            color: #dc3545;
        }

        .strength-text.medium {
            color: #ffc107;
        }

        .strength-text.strong {
            color: #28a745;
        }

        footer {
            background-color: rgba(0, 0, 0, 0.1);
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            padding: 20px 0;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-image"></i> Hama Sharing App
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" id="nav-home" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="nav-dashboard" href="/dashboard">Dashboard</a>
                    </li>
                    <li class="nav-item" id="nav-admin-item" style="display: none;">
                        <a class="nav-link" id="nav-admin" href="/admin">
                            <i class="bi bi-shield-check"></i> Admin
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="nav-urls" href="/urls">
                            <i class="bi bi-link-45deg"></i> URLs
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="nav-change-password" href="/change-password">
                            <i class="bi bi-key"></i> Trocar Senha
                        </a>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-danger btn-sm" onclick="logout()">
                            <i class="bi bi-box-arrow-right"></i> Logout
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-main container">
        <div class="change-password-container">
            <div class="card">
                <h1 class="card-title">
                    <i class="bi bi-key"></i> Trocar Senha
                </h1>
                <p class="card-subtitle">Altere sua senha de forma segura</p>

                <div id="alert-container"></div>

                <form id="change-password-form">
                    <div class="form-group">
                        <label for="old-password" class="form-label">Senha Atual</label>
                        <input
                            type="password"
                            class="form-control"
                            id="old-password"
                            name="old_password"
                            placeholder="Digite sua senha atual"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="new-password" class="form-label">Nova Senha</label>
                        <input
                            type="password"
                            class="form-control"
                            id="new-password"
                            name="new_password"
                            placeholder="Digite uma nova senha"
                            required
                            onkeyup="checkPasswordStrength()"
                        >
                        <div class="password-strength" id="password-strength"></div>
                        <div class="strength-text" id="strength-text"></div>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password" class="form-label">Confirmar Nova Senha</label>
                        <input
                            type="password"
                            class="form-control"
                            id="confirm-password"
                            name="confirm_password"
                            placeholder="Confirme a nova senha"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-change">
                        <i class="bi bi-check-circle"></i> Alterar Senha
                    </button>
                    <a href="/dashboard" class="btn btn-back">
                        <i class="bi bi-arrow-left"></i> Voltar
                    </a>
                </form>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Hama Sharing App  - Todos os direitos reservados</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/navigation.js"></script>
    <script>
        function checkAuth() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/login';
                return;
            }

            // Mostrar admin se for admin
            const isAdmin = localStorage.getItem('is_admin') === '1';
            const navAdmin = document.getElementById('nav-admin');
            if (isAdmin && navAdmin) {
                navAdmin.style.display = 'block';
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            localStorage.removeItem('is_admin');
            window.location.href = '/';
        }

        function checkPasswordStrength() {
            const password = document.getElementById('new-password').value;
            const strengthBar = document.getElementById('password-strength');
            const strengthText = document.getElementById('strength-text');

            if (password.length === 0) {
                strengthBar.classList.remove('show');
                strengthText.classList.remove('show');
                return;
            }

            strengthBar.classList.add('show');
            strengthText.classList.add('show');

            let strength = 0;
            let message = '';

            // Verificar tamanho
            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;

            // Verificar tipos de caracteres
            if (/[a-z]/.test(password)) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;

            if (strength <= 2) {
                strengthBar.className = 'password-strength show weak';
                strengthText.className = 'strength-text show weak';
                message = 'Senha fraca';
            } else if (strength <= 4) {
                strengthBar.className = 'password-strength show medium';
                strengthText.className = 'strength-text show medium';
                message = 'Senha média';
            } else {
                strengthBar.className = 'password-strength show strong';
                strengthText.className = 'strength-text show strong';
                message = 'Senha forte';
            }

            strengthText.textContent = message;
        }

        document.getElementById('change-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const oldPassword = document.getElementById('old-password').value;
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const token = localStorage.getItem('token');
            const alertContainer = document.getElementById('alert-container');

            // Validações
            if (newPassword !== confirmPassword) {
                alertContainer.innerHTML = '<div class="alert alert-warning"><i class="bi bi-exclamation-circle"></i> As senhas não conferem!</div>';
                return;
            }

            if (newPassword.length < 6) {
                alertContainer.innerHTML = '<div class="alert alert-warning"><i class="bi bi-exclamation-circle"></i> A nova senha deve ter pelo menos 6 caracteres!</div>';
                return;
            }

            if (oldPassword === newPassword) {
                alertContainer.innerHTML = '<div class="alert alert-warning"><i class="bi bi-exclamation-circle"></i> A nova senha deve ser diferente da atual!</div>';
                return;
            }

            try {
                const response = await fetch(
                    `/auth/change-password?old_password=${encodeURIComponent(oldPassword)}&new_password=${encodeURIComponent(newPassword)}&token=${token}`,
                    { method: 'POST' }
                );

                const data = await response.json();

                if (response.ok) {
                    alertContainer.innerHTML = '<div class="alert alert-success"><i class="bi bi-check-circle"></i> Senha alterada com sucesso! Redirecionando...</div>';
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 2000);
                } else {
                    alertContainer.innerHTML = `<div class="alert alert-danger"><i class="bi bi-exclamation-circle"></i> ${data.detail}</div>`;
                }
            } catch (error) {
                alertContainer.innerHTML = '<div class="alert alert-danger"><i class="bi bi-exclamation-circle"></i> Erro ao trocar senha. Tente novamente.</div>';
                console.error('Erro:', error);
            }
        });

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
        });
    </script>
</body>
</html>
