services:
  - type: web
    name: hamma-sharing-app
    env: python
    region: ohio
    plan: free
    pythonVersion: 3.11
    
    # Build command
    buildCommand: |
      pip install -r requirements.txt
      python init_db.py
    
    # Start command
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    
    # Ambiente
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: hamma_sharing_app_db
          property: connectionString
    
    # Health check
    healthCheckPath: "/"
  
  # Database PostgreSQL
  - type: pserv
    name: hamma_sharing_app_db
    ipAllowList: []
    plan: free
    postgresVersion: 15
